<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balónky</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <style>
        /* ===== HRACÍ PLOCHA = obloha ===== */
        .plocha {
            position: relative;      /* „balónky“ se umisťují vůči ploše */
            height: 60vh;
            min-height: 320px;
            overflow: hidden;        /* co vyletí ven, není vidět */
            background: linear-gradient(#8ecae6, #e0f4ff);
            user-select: none;
        }
        .plocha-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            padding: 1rem;
            margin: 0;
            text-align: center;
            font-size: 1.25rem;
            color: #335;
        }

        /* ===== JEDEN „BALÓNEK“ – zatím barevný čtverec s kulatými rohy ===== */
        .balonek {
            position: absolute;      /* JS nastaví left a top v % */
            translate: -50% -50%;    /* left/top = STŘED čtverce */
            width: 3.5rem;
            height: 3.5rem;
            padding: 0;
            border: 0;
            border-radius: .75rem;
            background-color: tomato;     /* JS nastaví náhodnou barvu */
            cursor: pointer;
        }
        /* volitelně: místo barvy obrázek (img/beruska.svg …) */
        .balonek.obrazek {
            background-color: transparent;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
    </style>

</head>
<body>
    <nav class="bg-1">
        <div class="container">
            Balónky
        </div>
        
    </nav>
    <div class="container">

        <main class="row">
            <aside class="col-12 lg:col-4">
                Nastavení
            </aside>
            <section class="col-12, lg:col-8">
                Hra
            </section>
        </main>

    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
