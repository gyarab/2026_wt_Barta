<!DOCTYPE html>
<html lang="cs" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <!-- BEZ TOHOTO ŘÁDKU RESPONZIVITA NA MOBILU NEFUNGUJE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxes</title>

    <!-- Bootstrap 6 (alpha) – CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <style>
        /* pomocné orámování krabic, ať vidíme, co se děje */
        .krabice {
            border: 2px dashed tomato;
            padding: 1rem;
            min-height: 80px;
        }
        .body{
            overflow-x: hidden;
        }
    </style>
</head>
<body>

    <!-- Ukazatel aktuálního breakpointu (vpravo dole) -->
    <div class="position-fixed bottom-0 end-0 m-3 badge theme-inverse fs-md">
        <span class="sm:d-none">XS &lt; 576</span>
        <span class="d-none sm:d-inline md:d-none">SM ≥ 576</span>
        <span class="d-none md:d-inline lg:d-none">MD ≥ 768</span>
        <span class="d-none lg:d-inline xl:d-none">LG ≥ 1024</span>
        <span class="d-none xl:d-inline 2xl:d-none">XL ≥ 1280</span>
        <span class="d-none 2xl:d-inline">2XL ≥ 1536</span>
    </div>

    <div class="container">
        <h1 class="my-5">Boxes</h1>
    </div>

    <div class="krabice">bez kontejneru</div>
    <div class="container"><div class="krabice">container</div></div>
    <div class="container-fluid"><div class="krabice">container-fluid</div></div>

    <p>Úkol 4a</p>

    <div class="container-fluid">
        <div class="row" >
            <div class="col-12 md:col-6 lg:col-4 xl:col-3 krabice">1</div>
            <div class="col-12 md:col-6 lg:col-4 xl:col-3 krabice">2</div>
            <div class="col-12 md:col-6 lg:col-4 xl:col-3 krabice">3</div>
            <div class="col-12 md:col-6 lg:col-4 xl:col-3 krabice">4</div>
            <div class="col-12 md:col-6 lg:col-4 xl:col-3 krabice">5</div>
            <div class="col-12 md:col-6 lg:col-4 xl:col-3 krabice">6</div>
            <div class="col-12 md:col-6 lg:col-4 xl:col-3 krabice">7</div>
            <div class="col-12 md:col-6 lg:col-4 xl:col-3 krabice">8</div>
        </div>
    
        <p>Úkol 4b, 4c</p>
    
        <div class="row row-cols-1 md:row-cols-2 lg:row-cols-3 xl:row-cols-4 g-5" >
            <div class="krabice">1</div>
            <div class="krabice">2</div>
            <div class="krabice">3</div>
            <div class="krabice">4</div>
            <div class="krabice">5</div>
            <div class="krabice">6</div>
            <div class="krabice">7</div>
            <div class="krabice">8</div>
        </div>
    
        <p>Úkol 5</p>
    
        <div class="row">
            <main class="col-12 lg:col-8 krabice">Hlavní obsah</main>
            <aside class="col-12 lg:col-4 krabice">Boční panel</aside>
        </div>
    
        <p>Úkol 7</p>
    
        <div class="alert theme-warning md:d-none">Jsi na mobilu</div>
        <div class="alert theme-info d-none lg:d-block">Jsi na velkém displeji</div>
    
        <p>Úkol 8</p>
    
        <nav class="navbar lg:navbar-expand bg-1">
          <div class="container">
            <a class="navbar-brand" href="#">Logo</a>
            <button class="btn-icon navbar-toggler" type="button"
                    data-bs-toggle="drawer" data-bs-target="#menu" aria-label="Menu">
              <span class="navbar-toggler-icon"></span>
            </button>
            <dialog class="drawer drawer-end" id="menu">
              <div class="drawer-header">
                <h5 class="drawer-title">Menu</h5>
                <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Zavřít"></button>
              </div>
              <div class="drawer-body">
                <ul class="nav navbar-nav md:ms-auto">
                  <li class="nav-item"><a class="nav-link active" href="#">Domů</a></li>
                  <li class="nav-item"><a class="nav-link" href="#hra">Hra</a></li>
                </ul>
              </div>
            </dialog>
          </div>
        </nav>
    </div>

    <!-- Bootstrap 6 – JS (je to ES modul => type="module") -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
