<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizitka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <style>
        .img{
            width:250px;
            border:5px solid black;
            border-radius:5px;
        }
        body{
            background-color: lightcyan;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vizitka{
            background-color: rgb(244, 106, 104);
            border-radius: 10px;
            padding: 20px;
        }
        button{
            padding: 20px 40px;
            color:rgb(233, 45, 45);
            border-radius: 5px;
            border:0;
            background: linear-gradient(rgb(221, 134, 253), rgb(108, 108, 249));
        }
        .obrazek{
            display: flex;
            justify-content: center;
            margin:20px 0;
        }
        h1 {
            text-align: center;
        }
    </style>
    <script>
        function klik(){
            alert("Tlačítko funguje" );
        }
    </script>
</head>
<body>
    <div class="vizitka">
        <h1><strong>Bill Gates</strong></h1>
        <div class="obrazek">
            <img class="img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTrZ9pr5aYbP12QPvSdaUUB4eueCW6snVFE5Ov6LcV90Vynx6u3aye3FR-L&s=10" alt="obrázek nenalezen">
        </div>
        <p>Americký podnikatel, investor a zakladatel společnosti Microsoft.</p>
        <h2>Oblíbené věci:</h2>
        <ul>
            <li>Knihy</li>
            <li>Jídlo</li>
            <li>Historie a věda</li>
        </ul>
        <button onclick="klik();">Barevné tlačítko</button>
    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
